<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Ilustrație abstractă — portret substituent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#17585A"/>
      <stop offset="0.55" stop-color="#0C3F40"/>
      <stop offset="1" stop-color="#072F30"/>
    </linearGradient>
    <linearGradient id="fig" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A9C4B9"/>
      <stop offset="0.55" stop-color="#649084"/>
      <stop offset="1" stop-color="#1E5858"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#F6F6F0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F6F6F0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="800" height="1000"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="1000" fill="url(#bg)"/>
    <rect width="800" height="1000" fill="url(#glow)"/>

    <!-- concentric rings, with dots set symmetrically around the axis -->
    <g fill="none" stroke="#F6F6F0" stroke-opacity="0.15" stroke-width="1.5">
      <circle cx="400" cy="360" r="170"/>
      <circle cx="400" cy="360" r="235"/>
      <circle cx="400" cy="360" r="305"/>
      <circle cx="400" cy="360" r="380"/>
    </g>
    <g fill="#F6F6F0" fill-opacity="0.5">
      <circle cx="400" cy="125" r="4"/>
      <circle cx="400" cy="55" r="4"/>
      <circle cx="165" cy="360" r="4"/>
      <circle cx="635" cy="360" r="4"/>
      <circle cx="95" cy="360" r="4"/>
      <circle cx="705" cy="360" r="4"/>
      <circle cx="184" cy="144" r="4"/>
      <circle cx="616" cy="144" r="4"/>
      <circle cx="234" cy="194" r="4"/>
      <circle cx="566" cy="194" r="4"/>
    </g>

    <!-- abstract figure -->
    <g fill="url(#fig)">
      <circle cx="400" cy="352" r="128"/>
      <path d="M400 512c132 0 240 104 258 240 6 44 10 96 12 156v92H130v-92c2-60 6-112 12-156 18-136 126-240 258-240Z"/>
    </g>

    <!-- shoulder highlight -->
    <path d="M400 512c132 0 240 104 258 240 6 44 10 96 12 156v92h-64v-92c-4-176-96-300-206-300s-202 124-206 300v92h-64v-92c2-60 6-112 12-156 18-136 126-240 258-240Z" fill="#F6F6F0" fill-opacity="0.08"/>

    <!-- psi mark -->
    <text x="400" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#0C3F40" fill-opacity="0.72" text-anchor="middle">Ψ</text>
  </g>
</svg>
