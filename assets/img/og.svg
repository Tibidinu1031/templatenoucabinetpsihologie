  <rect x="80" y="500" width="1040" height="1" fill="#C4CFDD"/>
  <text x="80" y="544" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6F8195">Evaluare psihologică</text>
  <text x="320" y="544" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6F8195">Consiliere</text>
  <text x="470" y="544" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6F8195">Ședințe individuale și de cuplu</text>
