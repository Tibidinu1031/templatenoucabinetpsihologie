  <text x="172" y="118" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#131A24">Meridian</text>
  <text x="172" y="146" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#6F8195">CABINET DE PSIHOLOGIE</text>

