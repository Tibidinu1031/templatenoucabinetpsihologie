  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="330" fill="url(#orb)"/>
  <circle cx="120" cy="600" r="260" fill="url(#orb2)"/>

  <g fill="none" stroke="#2A55AB" stroke-opacity="0.16" stroke-width="1.8" stroke-linecap="round">
