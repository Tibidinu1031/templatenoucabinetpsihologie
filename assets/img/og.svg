    <circle cx="1010" cy="330" r="175" stroke-dasharray="210 900"/>
    <circle cx="1010" cy="330" r="232" stroke-dasharray="620 900"/>
  </g>

  <circle cx="116" cy="122" r="36" fill="url(#mark)"/>
  <g fill="none" stroke="#F7F9FC" stroke-width="2.2" stroke-linecap="round">
